spring.application.name=vaultora

spring.config.import=optional:file:../../.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${APP_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}}
spring.datasource.username=${APP_DB_USERNAME:${APP_DB_USER:ledgerline_runtime}}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_DB_URL:${spring.datasource.url}}
spring.flyway.user=${FLYWAY_DB_USERNAME:${FLYWAY_DB_USER:ledgerline_app}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173}}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
