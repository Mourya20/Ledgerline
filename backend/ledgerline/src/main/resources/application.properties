spring.application.name=ledgerline

spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${APP_DB_USER:ledgerline_runtime}
spring.datasource.password=${APP_DB_PASSWORD:ledgerline_runtime_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.user=${FLYWAY_DB_USER:ledgerline_app}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD:ledgerline_secret}}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}