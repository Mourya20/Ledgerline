spring.application.name=ledgerline-test

spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ledgerline_test_db}
spring.datasource.username=${DB_USERNAME:ledgerline_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.user=${FLYWAY_DB_USER:ledgerline_app}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD:ledgerline_secret}}

ledgerline.runtime.username=${APP_DB_USER:ledgerline_runtime}
ledgerline.runtime.password=${APP_DB_PASSWORD:ledgerline_runtime_secret}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
