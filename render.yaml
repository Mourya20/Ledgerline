services:
  - type: web
    name: vaultora-backend
    runtime: docker
    dockerfilePath: backend/ledgerline/Dockerfile
    dockerContext: backend/ledgerline
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_DB_URL
        fromDatabase:
          name: vaultora-postgres
          property: connectionString
      - key: APP_DB_USERNAME
        value: ledgerline_runtime
      - key: APP_DB_PASSWORD
        sync: false
      - key: FLYWAY_DB_URL
        fromDatabase:
          name: vaultora-postgres
          property: connectionString
      - key: FLYWAY_DB_USERNAME
        value: ledgerline_app
      - key: DB_PASSWORD
        fromDatabase:
          name: vaultora-postgres
          property: password
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: vaultora-postgres
    databaseName: ledgerline_db
    user: ledgerline_app
    plan: starter
